<section class="page-title">
    <h1>Activities Registration</h1>
    <p>Register for your favorite school activity.</p>
</section>

<section class="container">
    <form class="form-grid"
    onsubmit="event.preventDefault(); alert('Demo only');">

        <div class="form-group">
            <label for="name">Student Name</label>
            <input type="text" id="name" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label for="grade">Grade</label>
            <select id="grade" required>
                <option value="">Choose Grade</option>
                <option>Grade 10</option>
                <option>Grade 11</option>
                <option>Grade 12</option>
            </select>
        </div>

        <div class="form-group">
            <label for="activity">Activity</label>
            <select id="activity" required>
                <option value="">Choose Activity</option>
                <option>Technology Club</option>
                <option>Science Lab</option>
                <option>Arts & Design</option>
            </select>
        </div>

        <div class="form-group full">
            <label for="notes">Notes</label>
            <textarea id="notes"></textarea>
        </div>

        <div class="form-group full checkbox">
            <input type="checkbox" id="agree" required>
            <label for="agree">I agree to the registration information.</label>
        </div>

        <div class="form-group full">
            <button type="submit" class="btn">Send Registration</button>
        </div>

    </form>
</section>
